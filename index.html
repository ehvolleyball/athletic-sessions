<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Athlete Session Request</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #1e293b; background: #f1f5f9; }
    main { max-width: 900px; margin: 32px auto; padding: 24px; }
    header { text-align: center; background: white; padding: 28px; border-radius: 14px; margin-bottom: 20px; }
    h1 { margin-top: 0; line-height: 1.2; }
    p { line-height: 1.6; }
    a { color: #174db0; overflow-wrap: anywhere; }
    a:focus-visible { outline: 3px solid #e99e16; outline-offset: 4px; }
    .form-container { background: white; border-radius: 14px; overflow: hidden; }
    .flyer { margin: 24px 0 0; }
    .flyer img { display: block; width: 100%; height: auto; border-radius: 14px; }
    iframe { display: block; width: 100%; height: 1400px; border: 0; }
    @media (max-width: 600px) { main { margin: 12px auto; padding: 12px; } header { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Athlete Session Request</h1>
      <p>Complete the form below to submit your request. Your reservation will be confirmed separately.</p>
    </header>
    <section class="form-container" aria-label="Session request form">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe6Mobpkp7_Lg79qszbm-qgFY744a4KnCTig9AA3qM-JaYonA/viewform?embedded=true" title="Athlete session request Google Form">Loading Google Form…</iframe>
    </section>
    <figure class="flyer">
      <img src="oct10.jpg" alt="EHVB volleyball event on October 10th, 1–3 PM at Order on the Court, CT 3. Cost: $20. Come try to ace, dig, or get a kill on coach." loading="lazy">
    </figure>
  </main>
</body>
</html>
