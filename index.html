<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EHVB | Home</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f5f7;
  color: #20232b;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 28px;
}


/* WELCOME BANNER */

.banner-header {
  width: 100%;
  margin-bottom: 42px;
}

.welcome-banner {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 8px 24px #0002;
}


/* MAIN CONTENT */

.hub {
  display: grid;
  grid-template-columns:
    minmax(0, 1.2fr)
    minmax(0, 1fr)
    minmax(0, .9fr);
  gap: 32px;
  align-items: start;
}


/* COLUMN HEADINGS */

.section-title {
  margin: 0 0 18px;
  text-align: center;
  font-size: 26px;
  font-weight: 700;
}


/* GROUP SESSION */

.group-session {
  text-align: center;
}

.flyer {
  margin: 0;
}

.flyer img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 8px 24px #0002;
}


/* REQUEST A SESSION */

.session {
  text-align: center;
}

.session-link {
  display: block;
  width: 100%;
  text-decoration: none;
  border-radius: 12px;
}

.session-image {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 8px 24px #0002;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.session-link:hover .session-image {
  transform: scale(1.02);
  box-shadow: 0 12px 28px #0003;
}

.session-link:focus-visible {
  outline: 3px solid #20232b;
  outline-offset: 5px;
}


/* MEDIA */

.socials {
  text-align: center;
}

.social-icons {
  display: flex;
  justify-content: center;
  gap: 22px;
  align-items: center;
  padding-top: 10px;
}

.social-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  color: inherit;
  text-decoration: none;
}

.social-icon svg {
  width: 44px;
  height: 44px;
}

.social-icon:focus-visible {
  outline: 3px solid #20232b;
  outline-offset: 5px;
}


/* TABLET */

@media (max-width: 800px) {

  .hub {
    grid-template-columns: 1fr 1fr;
  }

  .group-session {
    grid-column: 1 / -1;
    max-width: 500px;
    width: 100%;
    justify-self: center;
  }

}


/* MOBILE */

@media (max-width: 500px) {

  main {
    padding: 18px;
  }

  .banner-header {
    margin-bottom: 28px;
  }

  .hub {
    grid-template-columns: 1fr;
  }

  .group-session {
    grid-column: auto;
  }

  .section-title {
    font-size: 24px;
  }

  .socials {
    padding-top: 10px;
  }

}

</style>
</head>


<body>

<main>


  <!-- WELCOME BANNER -->

  <header class="banner-header">

    <img
      src="ehvb-banner.png"
      alt="Welcome to EHVB!"
      class="welcome-banner"
    >

  </header>


  <!-- MAIN CONTENT -->

  <section
    class="hub"
    aria-label="EHVB volleyball sessions and media"
  >


    <!-- GROUP SESSION -->

    <div class="group-session">

      <h2 class="section-title">Group Session</h2>

      <figure class="flyer">

        <img
          src="oct10.jpg"
          alt="EHVB volleyball group session October 10th, 1–3 PM at Order on the Court, CT 3."
        >

      </figure>

    </div>


    <!-- REQUEST A SESSION -->

    <div class="session">

      <h2 class="section-title">Request a Session</h2>

      <a
        class="session-link"
        href="session-request.html"
        aria-label="Request a volleyball training session"
      >

        <img
          class="session-image"
          src="session.jpg"
          alt="EHVB volleyball training session"
        >

      </a>

    </div>


    <!-- MEDIA -->

    <div class="socials">

      <h2 class="section-title">
        Media Accounts
      </h2>

      <div class="social-icons">


        <!-- YOUTUBE -->

        <a
          class="social-icon"
          href="https://www.youtube.com/@EHVolleyball"
          target="_blank"
          rel="noopener noreferrer"
        >

          <svg
            role="img"
            aria-label="YouTube"
            viewBox="0 0 48 48"
          >
            <rect
              x="2"
              y="9"
              width="44"
              height="30"
              rx="9"
              fill="#ff0000"
            />
            <path
              d="M20 17 L33 24 L20 31Z"
              fill="white"
            />
          </svg>

          <span>YouTube</span>

        </a>


        <!-- INSTAGRAM -->

        <a
          class="social-icon"
          href="https://www.instagram.com/eh.volleyball?stkn=c3c2ZzZyNWQ5dzE0&amp;utm_source=qr"
          target="_blank"
          rel="noopener noreferrer"
        >

          <svg
            role="img"
            aria-label="Instagram"
            viewBox="0 0 48 48"
          >

            <defs>
              <linearGradient
                id="instagram"
                x1="0"
                y1="1"
                x2="1"
                y2="0"
              >
                <stop stop-color="#ffcc55"/>
                <stop offset=".45" stop-color="#ef285d"/>
                <stop offset="1" stop-color="#7843d5"/>
              </linearGradient>
            </defs>

            <rect
              width="48"
              height="48"
              rx="13"
              fill="url(#instagram)"
            />

            <rect
              x="10"
              y="10"
              width="28"
              height="28"
              rx="8"
              fill="none"
              stroke="white"
              stroke-width="3"
            />

            <circle
              cx="24"
              cy="24"
              r="7"
              fill="none"
              stroke="white"
              stroke-width="3"
            />

            <circle
              cx="33"
              cy="15"
              r="2"
              fill="white"
            />

          </svg>

          <span>Instagram</span>

        </a>


        <!-- TIKTOK -->

        <a
          class="social-icon"
          href="https://www.tiktok.com/@ehvolleyball?_r=1&amp;_t=ZP-9ACexFUm37X"
          target="_blank"
          rel="noopener noreferrer"
        >

          <svg
            role="img"
            aria-label="TikTok"
            viewBox="0 0 48 48"
          >

            <rect
              width="48"
              height="48"
              rx="12"
              fill="#111"
            />

            <path
              d="M28 10v23a8 8 0 1 1-7-8v5a3 3 0 1 0 2 3V10h5c1 6 4 8 9 8v5c-4 0-7-1-9-3"
              fill="#25f4ee"
              transform="translate(-1 1)"
            />

            <path
              d="M28 10v23a8 8 0 1 1-7-8v5a3 3 0 1 0 2 3V10h5c1 6 4 8 9 8v5c-4 0-7-1-9-3"
              fill="#fe2c55"
              transform="translate(1 0)"
            />

            <path
              d="M28 10v23a8 8 0 1 1-7-8v5a3 3 0 1 0 2 3V10h5c1 6 4 8 9 8v5c-4 0-7-1-9-3"
              fill="white"
            />

          </svg>

          <span>TikTok</span>

        </a>

      </div>

    </div>


  </section>

</main>

</body>

</html>
